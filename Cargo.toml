[package]
name = "todo"
version = "0.1.0"
edition = "2024"

[package.metadata.cargo-shear]
ignored = ["image"] # We only use the dependency to add more features to it

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
eframe = "0.35.0"
egui_extras = { version = "*", features = ["datepicker", "all_loaders"] }
image = { version = "*", features = ["jpeg", "png"] } 
jiff = "0.2.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"

