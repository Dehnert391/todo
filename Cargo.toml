[package]
name = "todo"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
eframe = "0.35.0"
egui_extras = { version = "0.35.0", features = ["datepicker", "all_loaders"] }
jiff = "0.2.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"

